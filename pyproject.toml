[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "liaowang"
version = "0.1.0"
description = "GitHub 情报简报：抓候选、分批评分、给一句话结论"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
liaowang = "liaowang.cli:main"

[tool.setuptools]
packages = ["liaowang"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
